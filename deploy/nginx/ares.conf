# Nginx reverse proxy for Project Ares on a single VPS (AWS EC2, Ubuntu 26.04 LTS)
#
# Install:
#   sudo cp deploy/nginx/ares.conf /etc/nginx/sites-available/ares
#   sudo ln -s /etc/nginx/sites-available/ares /etc/nginx/sites-enabled/ares
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is the HTTP-only version. Running
#   sudo certbot --nginx -d asad-ares.duckdns.org
# afterwards adds the 443/SSL block and the http -> https redirect to this file automatically.
#
# The containers publish only on 127.0.0.1 (see docker-compose.yaml),
# so Nginx is the single public entry point.

server {
    listen 80;
    listen [::]:80;
    server_name asad-ares.duckdns.org;

    # Frontend (React build served by the nginx container)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API: /api/... is forwarded to the backend without the /api prefix
    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
