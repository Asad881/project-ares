frontend:
  replicaCount: 3
  image:
    repository: shiekh664/ares-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80

backend:
  replicaCount: 3
  image:
    repository: shiekh664/ares-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 3000
  env:
  - name: MONGO_URI
    value: mongodb://ares-db:27017/ares_ecommerce

mongodb:
  replicaCount: 1
  image:
    repository: mongo
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 27017
  persistence:
    enabled: true
    storageClass: "standard"
    accessMode: ReadWriteOnce
    size: 1Gi
    mountPath: /data/db
