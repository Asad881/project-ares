apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ares-frontend-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend-service
              port: 
                number: {{ .Values.frontend.service.port }}

      