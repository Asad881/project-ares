apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ares-ingress
spec:
  rules:
    - http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend-service
              port: 
                number: {{ .Values.frontend.service.port }}

        - path: /api
          pathType: Prefix
          backend:
            service:
              name: backend-service
              port:
                number: {{ .Values.backend.service.port }}
